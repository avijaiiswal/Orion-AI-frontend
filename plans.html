<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plans — Orion Hub</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
    /* Original price with strikethrough */
    .price-orig {
        font-size: 14px;
        color: var(--text-faint);
        text-decoration: line-through;
        margin-bottom: 4px;
        display: flex;
        align-items: baseline;
        gap: 4px;
    }
    .price-orig-period {
        font-size: 12px;
        color: var(--text-faint);
    }
    /* Final price row */
    .price-final-row {
        display: flex;
        align-items: baseline;
        gap: 6px;
    }
    /* Override plan-card-price to stack vertically for discounted plans */
    .plan-card-price {
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        margin-bottom: 4px;
    }
</style>
</head>
<body>
<div class="app-shell">
    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="brand"><i class="fa-solid fa-meteor"></i> Orion Hub</div>
        <a class="nav-item" href="index.html"><i class="fa-solid fa-rocket"></i> Back to App</a>
        <button class="nav-item active"><i class="fa-solid fa-bolt"></i> Plans</button>
        <div class="sidebar-plans">
            <div class="sidebar-plans-label">Plan</div>
            <button class="plan-btn current plan-tier-free" id="currentPlanBtn">
                <span class="plan-btn-title">
                    <span id="currentPlanName">Free</span>
                    <small id="currentPlanSub">Your current plan</small>
                </span>
                <i class="fa-solid fa-circle-check plan-btn-icon"></i>
            </button>
        </div>
        <div class="sidebar-footer">
            <a class="sidebar-link" href="about.html"><i class="fa-solid fa-circle-info"></i> About</a>
            <a class="sidebar-link" href="terms.html"><i class="fa-solid fa-file-contract"></i> Terms</a>
            <a class="sidebar-link" href="privacy.html"><i class="fa-solid fa-shield-halved"></i> Privacy</a>
            <a class="sidebar-link" href="feedback.html"><i class="fa-solid fa-comment-dots"></i> Feedback</a>
            <span class="sidebar-link" onclick="triggerSupport()"><i class="fa-solid fa-headset"></i> Support</span>
            <span class="sidebar-link" onclick="logoutUser()"><i class="fa-solid fa-arrow-right-from-bracket"></i> Log out</span>
        </div>
    </aside>
    <!-- MAIN -->
    <main class="main" style="max-width: 1100px;">
        <div class="plans-page-header">
            <h1>Upgrade your plan</h1>
            <p>More generations, faster results, full access to every tool.</p>
        </div>
        <section class="plans-grid" id="plansGrid">
            <!-- Cards injected by plans.js -->
        </section>
        <p style="font-size:13px; color:var(--text-dim); text-align:center; margin-top:24px;">
            Pay via PayPal: <span id="paypalEmail">—</span> · Then email your receipt + account email to
            <span id="supportEmail">—</span> for activation.
        </p>
    </main>
</div>
<div class="toast-container" id="toastContainer"></div>
<script src="auth.js"></script>
<script src="script.js"></script>
<script src="plans.js"></script>
</body>
</html>
